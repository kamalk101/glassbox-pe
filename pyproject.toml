[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-pe"
version = "0.1.0"
description = "Offline, evidence-first triage for Windows PE executables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "GlassBox PE" }]
dependencies = [
    "pefile>=2023.2.7",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "yara-python>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
emu = [
    "speakeasy-emulator>=1.5.11",
    "setuptools<81",
]

[project.scripts]
glassbox = "glassbox.cli:cli"

[tool.setuptools.packages.find]
include = ["glassbox*"]

[tool.setuptools.package-data]
"glassbox.report" = ["templates/*.j2"]
"glassbox.static" = ["yara_rules/*.yar", "yara_rules/*.yara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
